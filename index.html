<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Jahresfeier – Rückmeldung</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#06101f;color:#fff}body{min-height:100svh}button,input{font:inherit}
.page{min-height:100svh;position:relative;display:flex;align-items:center;justify-content:flex-end;padding:clamp(28px,4vw,72px);overflow:hidden;background-image:linear-gradient(90deg,rgba(2,7,16,.04) 0%,rgba(2,7,16,.10) 42%,rgba(2,7,16,.68) 66%,rgba(2,7,16,.91) 100%),url("hero-desktop.jpg");background-size:cover;background-position:center;background-repeat:no-repeat}.page:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 76% 45%,rgba(0,0,0,0),rgba(0,0,0,.08) 42%,rgba(0,0,0,.2) 100%)}.card{position:relative;z-index:2;width:min(540px,43vw);padding:clamp(26px,3vw,42px);border-radius:28px;background:linear-gradient(180deg,rgba(10,18,29,.80),rgba(4,10,18,.88));border:1px solid rgba(239,186,59,.55);box-shadow:0 22px 70px rgba(0,0,0,.45);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}.eyebrow{margin:0 0 12px;text-align:center;font-family:Georgia,"Times New Roman",serif;font-size:clamp(29px,2.3vw,42px);font-weight:500;color:#f3c34c}.intro{text-align:center;color:#f3f5f7;font-size:clamp(15px,1.15vw,18px);line-height:1.5;margin:0 auto 24px;max-width:420px}label{display:block;font-size:16px;font-weight:650;margin:17px 0 9px;color:#f7f7f7}.req{color:#f3c34c}.name{width:100%;height:56px;border:1px solid rgba(255,255,255,.23);border-radius:13px;background:rgba(255,255,255,.95);color:#111;padding:0 16px;outline:none}.name:focus{border:2px solid #f0bd3d;box-shadow:0 0 0 3px rgba(240,189,61,.14)}.choice{width:100%;min-height:61px;border-radius:13px;border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;gap:13px;padding:9px 15px;margin:10px 0;background:rgba(255,255,255,.09);color:#fff;font-weight:650;font-size:17px;cursor:pointer;transition:.18s ease}.choice:hover{background:rgba(255,255,255,.15);transform:translateY(-1px)}.choice .icon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:800;flex:0 0 auto}.yes .icon{background:#27a657}.no .icon{background:#d44b4b}.choice[aria-pressed="true"]{border-color:#f0bd3d;background:rgba(240,189,61,.16);box-shadow:0 0 0 2px rgba(240,189,61,.16)}.submit{width:100%;height:60px;margin-top:19px;border:0;border-radius:13px;background:linear-gradient(180deg,#f3c84f,#dba82e);color:#17130b;font-weight:800;font-size:18px;cursor:pointer;box-shadow:0 9px 25px rgba(218,164,40,.22)}.submit:hover{filter:brightness(1.05)}.privacy{text-align:center;font-size:12px;line-height:1.45;color:#c9ced6;margin:16px 0 0}.status{text-align:center;color:#f3c34c;font-size:13px;min-height:18px;margin-top:8px}.closed{display:none;position:absolute;inset:0;z-index:5;border-radius:inherit;background:rgba(4,10,18,.96);align-items:center;justify-content:center;text-align:center;padding:30px}.closed h2{font-family:Georgia,serif;color:#f3c34c;font-weight:500;font-size:32px;margin:0 0 12px}.closed p{line-height:1.5}.mobile-hero{display:none}@media(max-width:760px){html,body{background:#07101c}.page{display:block;min-height:100svh;padding:0 0 28px;background:#07101c;overflow:visible}.page:after{display:none}.mobile-hero{display:block;width:100%;height:clamp(225px,61vw,300px);background-image:url("hero-mobile.jpg");background-size:100% auto;background-repeat:no-repeat;background-position:center top}.card{width:calc(100% - 24px);max-width:560px;margin:-22px auto 0;padding:24px 18px 22px;border-radius:24px;background:linear-gradient(180deg,rgba(8,14,23,.96),rgba(3,8,15,.98));border:1px solid rgba(239,186,59,.58);box-shadow:0 18px 50px rgba(0,0,0,.48);backdrop-filter:none;-webkit-backdrop-filter:none}.eyebrow{font-size:clamp(25px,7vw,32px);margin-bottom:10px}.intro{font-size:15.5px;line-height:1.45;margin:0 auto 20px;max-width:330px}label{font-size:16px;margin:15px 0 8px}.name{height:54px;border-radius:12px;font-size:16.5px;padding:0 14px}.choice{min-height:58px;border-radius:12px;font-size:17px;padding:8px 14px;gap:12px}.choice .icon{width:36px;height:36px;font-size:23px}.submit{height:58px;margin-top:18px;border-radius:12px;font-size:18px}.privacy{font-size:11.5px;line-height:1.4;margin-top:15px}.status{font-size:13px}}@media(max-width:390px){.mobile-hero{height:215px}.card{width:calc(100% - 18px);padding:21px 15px 19px}.eyebrow{font-size:25px}.choice{font-size:16.5px}}@media(min-width:900px) and (max-width:1180px){.card{width:min(500px,46vw)}}</style></head><body><main class="page"><div class="mobile-hero" aria-hidden="true"></div><section class="card" aria-label="Rückmeldung zur Jahresfeier"><h1 class="eyebrow">Schön, dass Sie da sind! 🎉</h1><p class="intro">Bitte geben Sie uns kurz Bescheid, ob Sie an unserer Jahresfeier teilnehmen.</p><form id="rsvp" action="https://formsubmit.co/kontakt@orthopedes.de" method="POST"><label for="name">Vor- und Nachname <span class="req">*</span></label><input class="name" id="name" name="Vor- und Nachname" type="text" autocomplete="name" placeholder="Ihr Vor- und Nachname" required><label>Kommen Sie zur Jahresfeier? <span class="req">*</span></label><input type="hidden" id="attendance" name="Rückmeldung" value=""><input type="hidden" name="_subject" value="Neue Rückmeldung zur Jahresfeier"><input type="hidden" name="_template" value="table"><input type="hidden" name="_captcha" value="false"><input type="hidden" name="_next" value="https://monaseidel88-art.github.io/Jahresfeier/?danke=1"><button class="choice yes" id="yesBtn" type="button" aria-pressed="false"><span class="icon">✓</span><span>Ja, ich komme</span></button><button class="choice no" id="noBtn" type="button" aria-pressed="false"><span class="icon">×</span><span>Nein, ich komme nicht</span></button><button class="submit" type="submit">Antwort absenden</button><div class="status" id="status" aria-live="polite"></div><p class="privacy">🔒 Ihre Angaben werden vertraulich behandelt<br>und nur für die Organisation der Veranstaltung genutzt.</p></form><div class="closed" id="closed"><div><h2 id="closedTitle">Rückmeldung geschlossen</h2><p id="closedText">Vielen Dank für Ihre Rückmeldung. 🎉</p></div></div></section></main><script>const FORM_ACTIVE=true;const form=document.getElementById('rsvp'),yes=document.getElementById('yesBtn'),no=document.getElementById('noBtn'),attendance=document.getElementById('attendance'),status=document.getElementById('status'),closed=document.getElementById('closed'),closedTitle=document.getElementById('closedTitle'),closedText=document.getElementById('closedText');const thanked=new URLSearchParams(location.search).get('danke')==='1';if(thanked){form.style.visibility='hidden';closedTitle.textContent='Vielen Dank für Ihre Rückmeldung! 🎉';closedText.textContent='Ihre Antwort wurde erfolgreich übermittelt.';closed.style.display='flex'}else if(!FORM_ACTIVE){form.style.visibility='hidden';closed.style.display='flex'}function choose(v){attendance.value=v;yes.setAttribute('aria-pressed',v==='Ja, ich komme');no.setAttribute('aria-pressed',v==='Nein, ich komme nicht');status.textContent=''}yes.onclick=()=>choose('Ja, ich komme');no.onclick=()=>choose('Nein, ich komme nicht');form.addEventListener('submit',e=>{if(!attendance.value){e.preventDefault();status.textContent='Bitte wählen Sie Ja oder Nein aus.'}else if(!document.getElementById('name').value.trim()){e.preventDefault();status.textContent='Bitte tragen Sie Ihren Namen ein.'}})</script></body></html>
