<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Animationstest Jahresfeier</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
      radial-gradient(circle at center, #25234a 0%, #090914 55%, #000 100%);
    font-family: Arial, sans-serif;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    perspective: 900px;
  }

  .welcome {
    position: absolute;
    z-index: 10;
    left: 50%;
    top: 46%;
    transform: translate(-50%, -50%);
    padding: 18px 30px;
    border-radius: 18px;
    background: rgba(255,255,255,.95);
    color: #151515;
    font-size: clamp(20px, 3vw, 34px);
    font-weight: 700;
    box-shadow: 0 12px 40px rgba(0,0,0,.4);
    white-space: nowrap;
  }

  .character {
    position: absolute;
    z-index: 5;
    left: 50%;
    top: 48%;
    transform-origin: center bottom;

    font-size: 90px;

    animation: characterMove 7s ease-in-out infinite;
  }

  .hand {
    display: inline-block;
    transform-origin: 70% 80%;
    animation: wave 7s ease-in-out infinite;
  }

  .shadow {
    position: absolute;
    left: 50%;
    top: calc(48% + 105px);
    width: 120px;
    height: 25px;
    border-radius: 50%;
    background: rgba(0,0,0,.45);
    filter: blur(8px);

    animation: shadowMove 7s ease-in-out infinite;
  }

  @keyframes characterMove {
    0% {
      transform:
        translate(-50%, -50%)
        translateY(-80px)
        scale(.15);
      opacity: 0;
    }

    10% {
      opacity: 1;
    }

    35% {
      transform:
        translate(-50%, -50%)
        translateY(120px)
        scale(1.25);
      opacity: 1;
    }

    58% {
      transform:
        translate(-50%, -50%)
        translateY(120px)
        scale(1.25);
      opacity: 1;
    }

    88% {
      transform:
        translate(-50%, -50%)
        translateY(-80px)
        scale(.15);
      opacity: 1;
    }

    100% {
      transform:
        translate(-50%, -50%)
        translateY(-80px)
        scale(.15);
      opacity: 0;
    }
  }

  @keyframes wave {
    0%, 34% {
      transform: rotate(0deg);
    }

    38% {
      transform: rotate(-25deg);
    }

    42% {
      transform: rotate(25deg);
    }

    46% {
      transform: rotate(-25deg);
    }

    50% {
      transform: rotate(25deg);
    }

    55%, 100% {
      transform: rotate(0deg);
    }
  }

  @keyframes shadowMove {
    0%, 100% {
      transform: translateX(-50%) scale(.15);
      opacity: .15;
    }

    35%, 58% {
      transform: translateX(-50%) translateY(120px) scale(1.2);
      opacity: .65;
    }

    88% {
      transform: translateX(-50%) scale(.15);
      opacity: .15;
    }
  }

  .hint {
    position: absolute;
    bottom: 25px;
    width: 100%;
    text-align: center;
    color: rgba(255,255,255,.55);
    font-size: 14px;
  }
</style>
</head>

<body>

<div class="stage">

  <div class="welcome">
    Schön, dass Sie da sind!
  </div>

  <div class="shadow"></div>

  <div class="character">
    🦶<span class="hand">👋</span>
  </div>

  <div class="hint">
    Animationstest – wiederholt sich automatisch
  </div>

</div>

</body>
</html>
