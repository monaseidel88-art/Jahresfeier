<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Jahresfeier – Animationstest</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#06101f;color:#fff}body{min-height:100svh}button,input{font:inherit}.page{min-height:100svh;position:relative;display:flex;align-items:center;justify-content:flex-end;padding:clamp(28px,4vw,72px);overflow:hidden;background-image:linear-gradient(90deg,rgba(2,7,16,.04) 0%,rgba(2,7,16,.10) 42%,rgba(2,7,16,.68) 66%,rgba(2,7,16,.91) 100%),url("hero-desktop.jpg");background-size:cover;background-position:center;background-repeat:no-repeat}.page:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 76% 45%,rgba(0,0,0,0),rgba(0,0,0,.08) 42%,rgba(0,0,0,.2) 100%)}.card{position:relative;z-index:2;width:min(540px,43vw);padding:clamp(26px,3vw,42px);border-radius:28px;background:linear-gradient(180deg,rgba(10,18,29,.80),rgba(4,10,18,.88));border:1px solid rgba(239,186,59,.55);box-shadow:0 22px 70px rgba(0,0,0,.45);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}.eyebrow{margin:0 0 12px;text-align:center;font-family:Georgia,"Times New Roman",serif;font-size:clamp(29px,2.3vw,42px);font-weight:500;color:#f3c34c}.intro{text-align:center;color:#f3f5f7;font-size:clamp(15px,1.15vw,18px);line-height:1.5;margin:0 auto 24px;max-width:420px}label{display:block;font-size:16px;font-weight:650;margin:17px 0 9px;color:#f7f7f7}.req{color:#f3c34c}.name{width:100%;height:56px;border:1px solid rgba(255,255,255,.23);border-radius:13px;background:rgba(255,255,255,.95);color:#111;padding:0 16px;outline:none}.choice{width:100%;min-height:61px;border-radius:13px;border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;gap:13px;padding:9px 15px;margin:10px 0;background:rgba(255,255,255,.09);color:#fff;font-weight:650;font-size:17px;cursor:pointer}.choice .icon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:800;flex:0 0 auto}.yes .icon{background:#27a657}.no .icon{background:#d44b4b}.choice[aria-pressed="true"]{border-color:#f0bd3d;background:rgba(240,189,61,.16);box-shadow:0 0 0 2px rgba(240,189,61,.16)}.submit{width:100%;height:60px;margin-top:19px;border:0;border-radius:13px;background:linear-gradient(180deg,#f3c84f,#dba82e);color:#17130b;font-weight:800;font-size:18px;cursor:pointer}.privacy{text-align:center;font-size:12px;line-height:1.45;color:#c9ced6;margin:16px 0 0}.status{text-align:center;color:#f3c34c;font-size:13px;min-height:18px;margin-top:8px}.closed{display:none;position:absolute;inset:0;z-index:5;border-radius:inherit;background:rgba(4,10,18,.96);align-items:center;justify-content:center;text-align:center;padding:30px}.closed h2{font-family:Georgia,serif;color:#f3c34c;font-weight:500;font-size:32px;margin:0 0 12px}.mobile-hero{display:none}.videoMascot{position:absolute;z-index:4;left:0;bottom:3vh;width:clamp(220px,28vw,455px);pointer-events:none;filter:drop-shadow(0 18px 30px rgba(0,0,0,.5));transform-origin:50% 100%;animation:walkAcross 11s cubic-bezier(.45,.05,.35,1) infinite}.videoMascot canvas{display:block;width:100%;height:auto}.videoMascot video{display:none}@keyframes walkAcross{0%,4%{transform:translate3d(-30vw,4vh,0) scale(.42) rotate(-3deg);opacity:0}7%{opacity:1}10%{transform:translate3d(-20vw,2vh,0) scale(.49) rotate(4deg)}14%{transform:translate3d(-10vw,3.5vh,0) scale(.57) rotate(-4deg)}18%{transform:translate3d(0vw,1vh,0) scale(.66) rotate(4deg)}22%{transform:translate3d(9vw,2.5vh,0) scale(.76) rotate(-4deg)}26%{transform:translate3d(17vw,0,0) scale(.88) rotate(4deg)}30%{transform:translate3d(23vw,1.5vh,0) scale(.98) rotate(-3deg)}34%{transform:translate3d(27vw,0,0) scale(1.06) rotate(0)}38%,55%{transform:translate3d(27vw,0,0) scale(1.06) rotate(0);opacity:1}59%{transform:translate3d(23vw,1.5vh,0) scale(.98) rotate(3deg)}63%{transform:translate3d(17vw,0,0) scale(.88) rotate(-4deg)}67%{transform:translate3d(9vw,2.5vh,0) scale(.76) rotate(4deg)}71%{transform:translate3d(0vw,1vh,0) scale(.66) rotate(-4deg)}75%{transform:translate3d(-10vw,3.5vh,0) scale(.57) rotate(4deg)}79%{transform:translate3d(-20vw,2vh,0) scale(.49) rotate(-4deg)}84%{transform:translate3d(-30vw,4vh,0) scale(.42);opacity:1}88%,100%{transform:translate3d(-34vw,4vh,0) scale(.4);opacity:0}}.confetti{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}.piece{position:absolute;top:-10vh;width:8px;height:14px;border-radius:2px;opacity:.82;animation:fall linear infinite}.piece:nth-child(1){left:8%;background:#f3c34c;animation-duration:6.2s;animation-delay:-1s}.piece:nth-child(2){left:18%;background:#ff4f87;animation-duration:7.4s;animation-delay:-3s}.piece:nth-child(3){left:29%;background:#34c6ff;animation-duration:6.8s;animation-delay:-2s}.piece:nth-child(4){left:40%;background:#9cff57;animation-duration:8s;animation-delay:-4s}.piece:nth-child(5){left:51%;background:#a86bff;animation-duration:6.5s;animation-delay:-.5s}.piece:nth-child(6){left:63%;background:#ff9d2e;animation-duration:7.7s;animation-delay:-2.5s}.piece:nth-child(7){left:73%;background:#48e0d0;animation-duration:6.9s;animation-delay:-1.8s}.piece:nth-child(8){left:84%;background:#ff5b4d;animation-duration:8.2s;animation-delay:-3.7s}@keyframes fall{to{transform:translate3d(45px,115vh,0) rotate(760deg)}}@media(max-width:760px){.page{display:block;min-height:100svh;padding:0 0 28px;background:#07101c;overflow:hidden}.page:after{display:none}.mobile-hero{display:block;width:100%;height:clamp(225px,61vw,300px);background-image:url("hero-mobile.jpg");background-size:100% auto;background-repeat:no-repeat;background-position:center top}.card{width:calc(100% - 24px);max-width:560px;margin:-22px auto 0;padding:24px 18px 22px;border-radius:24px;background:linear-gradient(180deg,rgba(8,14,23,.96),rgba(3,8,15,.98));border:1px solid rgba(239,186,59,.58)}.eyebrow{font-size:clamp(25px,7vw,32px)}.intro{font-size:15.5px}.name{height:54px}.choice{min-height:58px;font-size:17px}.submit{height:58px}.videoMascot{top:70px;bottom:auto;width:48vw;max-width:220px;animation-name:walkMobile}@keyframes walkMobile{0%,4%{transform:translate3d(-55vw,0,0) scale(.42);opacity:0}8%{opacity:1}14%{transform:translate3d(-25vw,-3px,0) scale(.52) rotate(4deg)}20%{transform:translate3d(0,-9px,0) scale(.64) rotate(-4deg)}26%{transform:translate3d(22vw,-2px,0) scale(.78) rotate(4deg)}32%{transform:translate3d(40vw,-10px,0) scale(.92) rotate(-3deg)}38%,55%{transform:translate3d(48vw,-4px,0) scale(1.02);opacity:1}62%{transform:translate3d(38vw,-9px,0) scale(.9) rotate(3deg)}69%{transform:translate3d(15vw,-2px,0) scale(.73) rotate(-4deg)}76%{transform:translate3d(-12vw,-8px,0) scale(.58) rotate(4deg)}84%{transform:translate3d(-50vw,0,0) scale(.43);opacity:1}89%,100%{transform:translate3d(-58vw,0,0) scale(.4);opacity:0}}}</style></head><body><main class="page"><div class="mobile-hero"></div><div class="confetti" aria-hidden="true"><i class="piece"></i><i class="piece"></i><i class="piece"></i><i class="piece"></i><i class="piece"></i><i class="piece"></i><i class="piece"></i><i class="piece"></i></div><div class="videoMascot" aria-hidden="true"><video id="footVideo" muted playsinline autoplay loop preload="auto" src="2026-08-19%2003:51:50.MP4"></video><canvas id="footCanvas" width="506" height="454"></canvas></div><section class="card"><h1 class="eyebrow">Schön, dass Sie da sind! 🎉</h1><p class="intro">Bitte geben Sie uns kurz Bescheid, ob Sie an unserer Jahresfeier teilnehmen.</p><form id="rsvp" action="https://formsubmit.co/kontakt@orthopedes.de" method="POST"><label for="name">Vor- und Nachname <span class="req">*</span></label><input class="name" id="name" name="Vor- und Nachname" type="text" placeholder="Ihr Vor- und Nachname" required><label>Kommen Sie zur Jahresfeier? <span class="req">*</span></label><input type="hidden" id="attendance" name="Rückmeldung"><input type="hidden" name="_subject" value="Neue Rückmeldung zur Jahresfeier"><input type="hidden" name="_template" value="table"><input type="hidden" name="_captcha" value="false"><input type="hidden" name="_next" value="https://orthpoedes-jahresfeier.github.io/Jahresfeier/animation-test.html?danke=1"><button class="choice yes" id="yesBtn" type="button" aria-pressed="false"><span class="icon">✓</span>Ja, ich komme</button><button class="choice no" id="noBtn" type="button" aria-pressed="false"><span class="icon">×</span>Nein, ich komme nicht</button><button class="submit" type="submit">Antwort absenden</button><div class="status" id="status"></div><p class="privacy">🔒 Ihre Angaben werden vertraulich behandelt<br>und nur für die Organisation der Veranstaltung genutzt.</p></form><div class="closed" id="closed"><div><h2 id="closedTitle">Rückmeldung geschlossen</h2><p id="closedText">Vielen Dank für Ihre Rückmeldung. 🎉</p></div></div></section></main><script>const form=document.getElementById('rsvp'),yes=document.getElementById('yesBtn'),no=document.getElementById('noBtn'),attendance=document.getElementById('attendance'),status=document.getElementById('status'),closed=document.getElementById('closed');function choose(v){attendance.value=v;yes.setAttribute('aria-pressed',v==='Ja, ich komme');no.setAttribute('aria-pressed',v==='Nein, ich komme nicht');status.textContent=''}yes.onclick=()=>choose('Ja, ich komme');no.onclick=()=>choose('Nein, ich komme nicht');form.addEventListener('submit',e=>{if(!attendance.value){e.preventDefault();status.textContent='Bitte wählen Sie Ja oder Nein aus.'}});const v=document.getElementById('footVideo'),c=document.getElementById('footCanvas'),x=c.getContext('2d',{willReadFrequently:true});function draw(){if(v.readyState>=2){x.clearRect(0,0,c.width,c.height);x.drawImage(v,0,0,c.width,c.height);const im=x.getImageData(0,0,c.width,c.height),d=im.data;for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b),sat=mx-mn,avg=(r+g+b)/3;if(avg>175&&sat<34)d[i+3]=Math.max(0,Math.min(255,(sat-4)*12+(205-avg)*7))}x.putImageData(im,0,0)}requestAnimationFrame(draw)}v.addEventListener('loadeddata',()=>{v.play().catch(()=>{});draw()});if(v.readyState>=2){v.play().catch(()=>{});draw()}</script></body></html>
